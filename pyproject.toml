[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floodroute"
version = "0.1.0"
description = "Flood-resilient evacuation routing and shelter allocation for an MSCS thesis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rasterio>=1.3",
    "fiona>=1.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=0.14",
    "osmium>=4.3,<5",
    "networkx>=3.3",
    "earthengine-api>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]
dashboard = [
    "streamlit>=1.35",
    "streamlit-folium>=0.20",
    "folium>=0.16",
]

[project.scripts]
floodroute = "floodroute.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
