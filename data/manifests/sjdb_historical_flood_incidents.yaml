schema_version: "1.0"

dataset_id: sjdb_historical_flood_incidents
title: "Historical Flood Incident Records — San Jose de Buenavista, Antique"
category: historical_incidents

description: >
  Records of historical flood events affecting San Jose de Buenavista,
  including road closures, evacuation centre activations, displacement counts,
  and flood depth observations. Sources include NDRRMC Situation Reports,
  MDRRMO incident logs, OCD Region VI records, and media archives.
  Records must be entered into data/templates/historical_incidents_template.csv
  after validation. No incident records are pre-populated; all values must be
  sourced from official documentation or published situation reports.

