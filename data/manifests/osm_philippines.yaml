dataset_id: osm_philippines
title: "OpenStreetMap Road Network Extract — Philippines National PBF"
category: road_network

description: >
  OpenStreetMap (OSM) full national planet extract for the Philippines,
  distributed by Geofabrik as a regularly updated PBF snapshot.  Used as the
  base road network for evacuation-route modelling across all three study
  municipalities: Sibalom (primary experiment), San Jose de Buenavista, and
  Hamtic (both reduced-depth validation areas).

  This is a Philippines-wide extract — NOT a San Jose de Buenavista-specific
  clip.  Clipping to each municipality's bounding box (using osmium extract
  or equivalent) is a Stage 3 preprocessing step.  Do not rename or
  restructure the raw file; update local_path only after a verified derivative
  clip has been produced.

  Tag filtering to retain highway features only is also deferred to Stage 3
  (osmium tags-filter or pyosmium).

