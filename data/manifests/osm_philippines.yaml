dataset_id: osm_philippines
title: "OpenStreetMap Road Network Extract — Philippines National PBF"
category: road_network

description: >
  OpenStreetMap (OSM) national extract for the Philippines, distributed by
  Geofabrik as a regularly updated PBF snapshot. The extract served as the
  source road network for the FloodRoute case study in San Jose de Buenavista,
  Antique. The Philippines-wide source was clipped and processed for the
  municipal study area during graph construction.

