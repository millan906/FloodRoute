dataset_id: osm_waterways_sjdb
title: "OSM Waterways Layer — San Jose de Buenavista Study Area"
category: waterways

description: >
  Waterway features (rivers, streams, canals) for the San Jose de Buenavista
  study area, to be extracted from the OSM Philippines PBF using tag filtering
  (natural=water, waterway=*). This dataset will be derived from
  osm_san_jose_de_buenavista in Stage 2 and is not downloaded separately.
  An authoritative source (DPWH drainage network or NAMRIA river data)
  may supplement OSM in later stages.

