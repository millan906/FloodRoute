validation_notes: >
  Flood hazard maps are modelled/derived outputs from hydrological and hydraulic
  simulations, not measured inundation extents. Provenance is derived.
  The scenario_based category is reserved for thesis-created experimental flood
  stages and assumptions. Return periods and source model documentation must be
  confirmed from DOST-ASTI before use in analysis.

