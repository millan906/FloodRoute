validation_notes: >
  Flood hazard maps are modelled/derived outputs from LiDAR-derived hydrological
  and hydraulic simulations, not measured inundation extents.  Provenance is derived.
  Hazard classes (Low / Medium / High) represent depth-range thresholds, not temporal
  return periods — do not conflate hazard class with flood-stage timing.

  After download, validate each layer ZIP:
  1. ZIP opens without error (validate_zip_file).
  2. ZIP contains .shp, .dbf, .prj, .shx files.
  3. Attribute table includes a hazard-class or depth field.
  4. Geometry type is polygon covering study municipality barangays.
  5. CRS from .prj confirms EPSG:4326 (WGS84).
  6. All acquired return periods (5yr, 25yr, 100yr) present for each municipality
     before Stage 3 use.
  7. Sibalom layers: verify coverage aligns with Sibalom municipality barangays
     (76 barangays, adm3_pcode=PH0600616) by spatial join against phl_admin4 in Stage 3.
  8. Hamtic absence: document explicitly in thesis methods that Hamtic flood hazard
     analysis is limited or deferred due to no LiPAD coverage.

  Technical documentation (Phil-LiDAR 1 Program reports on hydrological methodology)
  must be cited in the thesis methods chapter before using these layers in analysis.

