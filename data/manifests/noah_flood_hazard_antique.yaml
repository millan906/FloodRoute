schema_version: "1.0"

dataset_id: noah_flood_hazard_antique
title: "Phil-LiDAR 1 Flood Hazard Maps — Sibalom and San Jose de Buenavista, Antique"
category: flood_hazard

description: >
  LiDAR-derived flood hazard polygons produced by the Phil-LiDAR 1 Program
  (DOST-ASTI / UP TCAGP / DREAM Program) under DOST Project NOAH successor activities.
  Three return-period layers (5yr / 25yr / 100yr) at 10-metre resolution are available
  for two of the three study municipalities:

  SAN JOSE DE BUENAVISTA (PSGC-prefix layer naming):
    5-year   (165.2 mm design storm): ph060613000_fh5yr_10m
    25-year  (4% annual probability): ph060613000_fh25yr_10m
    100-year (304.5 mm, 1% AEP)    : ph060613000_fh100yr_10m

  SIBALOM (river-name layer naming — Sibalom River basin):
    5-year  : sibalom_fh5yr_10m
    25-year : sibalom_fh25yr_10m
    100-year: sibalom_fh100yr_10m
    Tributary/upper basin supplement: sibalom2_fh5yr_10m

  HAMTIC (not available):
    No Phil-LiDAR 1 flood hazard layers are publicly available for Hamtic
    municipality.  The Hamtic River is approximately 6 km in length — likely
    too short for a full LiDAR hydrological survey to have been commissioned.
    Hamtic is retained as a reduced-depth validation area; flood hazard
    analysis for Hamtic will use coarser NOAH/GloFAS-derived inputs if
    available, or will be explicitly scoped out of flood-hazard comparisons.

  Each layer classifies flood depth into three hazard levels:
    Low    — 0.10–0.50 m depth (yellow)
    Medium — 0.50–1.50 m depth (orange)
    High   — > 1.50 m depth (red)

  Coverage is municipality-specific per layer set.  Sibalom layers are named by
  river basin, not by PSGC prefix; cross-check barangay lists against admin4
  boundaries to confirm complete coverage.

  Source: LiPAD (LiDAR Portal for Archiving and Distribution), hosted at
  https://lipad-fmc.dream.upd.edu.ph by the UP Training Center for Applied
  Geodesy and Photogrammetry (UP TCAGP).

  Acquisition instructions (manual — requires EULA acceptance per layer):
    San Jose de Buenavista layer landing pages (verified 2026-08-22):
      5-year : https://lipad-fmc.dream.upd.edu.ph/layers/geonode:ph060613000_fh5yr_10m
      25-year: https://lipad-fmc.dream.upd.edu.ph/layers/geonode:ph060613000_fh25yr_10m
      100-year: https://lipad-fmc.dream.upd.edu.ph/layers/geonode:ph060613000_fh100yr_10m

    Sibalom layer landing pages (verified 2026-08-22):
      5-year  : https://lipad-fmc.dream.upd.edu.ph/layers/geonode:sibalom_fh5yr_10m
      25-year : https://lipad-fmc.dream.upd.edu.ph/layers/geonode:sibalom_fh25yr_10m
      100-year: https://lipad-fmc.dream.upd.edu.ph/layers/geonode:sibalom_fh100yr_10m
      Supplemental: https://lipad-fmc.dream.upd.edu.ph/layers/geonode:sibalom2_fh5yr_10m

    WFS download URL pattern (after EULA acceptance):
      https://lipad-fmc.dream.upd.edu.ph/geoserver/wfs?format_options=charset%3AUTF-8
        &typename=geonode%3A[LAYER_NAME]&outputFormat=SHAPE-ZIP
        &version=1.0.0&service=WFS&request=GetFeature

    Steps:
      1. Visit each landing page and accept the Phil-LiDAR 1 End User Licence
         Agreement (EULA); provide institutional affiliation and intended use.
      2. Download Shapefile (WGS84) for each return period.
      3. Save to data/raw/noah_flood_hazard_antique/ as separate ZIPs:
         San Jose: fh5yr_ph060613000.zip, fh25yr_ph060613000.zip, fh100yr_ph060613000.zip
         Sibalom:  fh5yr_sibalom.zip, fh25yr_sibalom.zip, fh100yr_sibalom.zip,
                   fh5yr_sibalom2.zip
      4. Update local_path and record file_size_bytes / sha256 per layer.
      5. Run: floodroute verify-dataset noah_flood_hazard_antique

  Licence: Phil-LiDAR 1 EULA — non-commercial educational, research, NGO, and
  government use permitted; commercial use prohibited; derivatives must credit
  "Phil-LiDAR Program & DREAM".

