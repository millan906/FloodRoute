title: "DOST-ASTI / GeoRisk Flood Hazard Maps — Antique Province"
category: flood_hazard

description: >
  Flood hazard inundation maps for Antique Province produced by the
  Department of Science and Technology — Advanced Science and Technology
  Institute (DOST-ASTI), formerly under Project NOAH (Nationwide Operational
  Assessment of Hazards). Maps typically cover 5-year, 25-year, and 100-year
  return periods at 10-metre resolution and are publicly accessible through
  the GeoRisk Philippines platform. Exact coverage and return periods for
  San Jose de Buenavista municipality must be confirmed on the portal.

