title: "PSA 2020 Census Barangay Population — San Jose de Buenavista (PH0600613), 28 barangays"
category: barangay_population

description: >
  Barangay-level population counts from the 2020 Census of Population and
  Housing (2020 CPH), reference date May 1, 2020, for San Jose de Buenavista
  municipality (PSGC PH0600613), Antique Province, Philippines — 28 barangays,
  total population 65,140.

  Provenance: Values were researcher-transcribed from PhilAtlas
  (https://www.philatlas.com/visayas/r06/antique/san-jose-de-buenavista.html,
  accessed 2026-08-29), a Philippine geographic data aggregator that attributes
  all population figures to the Philippine Statistics Authority (PSA) 2020
  Census.  The underlying statistical authority is PSA.  PSA OpenStat and
  PSADA portals returned 403 errors at the time of access and could not be
  queried directly.

  Verification: Three individual barangay pages (Atabay, Funda-Dalipe,
  San Pedro) were spot-checked against the municipality summary table and
  matched exactly.  The 28-barangay total on PhilAtlas is 65,140, consistent
  with the published PSA 2020 CPH municipal total for San Jose de Buenavista.
  PhilAtlas does not publish PSGC codes; the adm4_pcode values in this file
  are drawn from the PSA/OCHA/HDX admin boundary dataset acquired in Stage 2
  (dataset_id phl_admin_boundaries) and cross-confirmed by a passing
  snap_barangay_origins test that matches all 28 PSGCs to barangay polygons.

  Limitation: Individual values have not been verified directly against an
  official PSA OpenStat export.  If PSA OpenStat becomes accessible, retrieve
  the barangay-level table for Region VI > Antique > San Jose de Buenavista
  and compare per-barangay figures against this file.  Replace any discrepant
  rows and update sha256, file_size_bytes, and validation_notes.

  Re-acquisition instructions (authoritative primary source):
    PSA OpenStat portal:
      https://openstat.psa.gov.ph/PXWeb/pxweb/en/DB/DB__2A__CPH/
    1. Navigate to: Database > 2A (2020 CPH) > Population > Barangay level
    2. Select Region VI — Western Visayas; filter to Antique Province >
       San Jose de Buenavista municipality
    3. Export table as CSV or Excel
    4. Extract the 28 barangay rows; confirm record count = 28 and sum = 65,140
    5. Replace this file if values differ; update sha256, file_size_bytes,
       acquisition_date, and validation_notes in this manifest

