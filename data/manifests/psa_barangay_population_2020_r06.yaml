validation_notes: >
  After download, validate:
  1. File opens as a valid XLSX (xl/workbook.xml present in ZIP).
  2. Identify the sheet containing barangay-level data (typically named by
     region or labelled "Table 1" / "Barangay").
  3. Confirm required columns are present: PSGC code (10-digit), barangay name,
     municipality name, province name, total population, male, female.
  4. Confirm San Jose de Buenavista (PSGC 060613000) appears as municipality.
  5. Confirm all 28 barangays of San Jose de Buenavista are present with
     non-zero population counts.
  6. Cross-reference total for San Jose de Buenavista against published
     PSA figure of 65,140 (2020 CPH).
  Do not transform or impute values — retain nulls for missing barangay records.

