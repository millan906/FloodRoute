validation_notes: >
  Checks performed on psa_barangay_population_sjdb_2020.csv (2026-08-29):
  1. Record count = 28 (confirmed: 28 rows excluding header).
  2. All 28 adm4_pcode values are unique.
  3. All adm4_pcode values carry prefix PH0600613 (San Jose de Buenavista).
  4. All population_2020 values are positive integers (> 0).
  5. Sum of all 28 population_2020 values = 65,140 — matches the PSA 2020 CPH
     municipal total as reported by PhilAtlas and consistent with published
     PSA figures.
  6. PSGC codes span PH0600613001–PH0600613030 with 012 and 013 absent (28
     codes); codes matched to admin boundary polygons in barangays_utm51n.gpkg
     (all 28 PSGCs resolved, confirmed by passing test_all_28_snap_to_unique_nodes).
  7. Population values transcribed from PhilAtlas municipality table and
     spot-checked against three individual barangay pages (Atabay 2180,
     Funda-Dalipe 7071, San Pedro 5750 — all matched).

  NOT validated: Individual per-barangay counts have not been verified directly
  against an official PSA OpenStat export.  PhilAtlas is a secondary aggregator;
  the underlying PSA primary table may differ in rounding or labelling.

