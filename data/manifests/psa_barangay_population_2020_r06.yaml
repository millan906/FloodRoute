schema_version: "1.0"

dataset_id: psa_barangay_population_2020_r06
title: "PSA 2020 Census Barangay Population — Region VI (Western Visayas)"
category: barangay_population

description: >
  Barangay-level population counts from the 2020 Census of Population and
  Housing (2020 CPH), conducted as of May 1, 2020, tabulated for Region VI
  (Western Visayas), covering Antique Province including San Jose de Buenavista
  municipality (28 barangays, total population 65,140 per 2020 CPH results).
  Used to spatialise evacuation demand at sub-municipal resolution; joined to
  admin boundary polygons via 10-digit PSGC codes.

  Acquisition instructions (manual — requires OpenStat navigation):
    PSA OpenStat portal: https://openstat.psa.gov.ph/PXWeb/pxweb/en/DB/DB__2A__CPH/
    1. Navigate to: Database > 2A (2020 CPH) > Population > Barangay level
    2. Select Region: VI — Western Visayas (or filter to Antique Province)
    3. Select all variables (population by sex, total)
    4. Export table as Excel (.xlsx) — use "Download data" → "Excel"
    5. Save to: data/raw/psa_barangay_population_2020_r06.xlsx
    6. After placing the file, run: floodroute verify-dataset psa_barangay_population_2020_r06

  Alternative: PSA 2020 CPH publication page at
    https://psa.gov.ph/content/highlights-region-vi-western-visayas-population-2020-census-population-and-housing-2020-cph
  may link to Excel tables for direct download without OpenStat navigation.

  Note: PSA does not publish a stable direct-download URL for the barangay population
  table. The OpenStat PX-Web interface provides interactive query and export.
  PSADA (https://psada.psa.gov.ph/catalog/231) holds the Public Use File microdata
  but requires registration and an access agreement letter to the National Statistician.

