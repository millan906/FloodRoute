schema_version: "1.0"

dataset_id: jrc_glofas_flood_hazard_v21
title: "JRC Global River Flood Hazard Maps — Version 2.1 (GloFAS)"
category: flood_hazard

description: >
  Global River Flood Hazard Maps produced by the Joint Research Centre (JRC) of the
  European Commission, based on GloFAS (Global Flood Awareness System) hydrological and
  hydraulic modelling. Version 2.1 provides modelled inundation depth (metres) at seven
  return periods (RP10, RP20, RP50, RP75, RP100, RP200, RP500) at approximately 90 m
  spatial resolution.

  The dataset covers global rivers with upstream catchment areas above approximately
  500 km². Smaller basins — including many Philippine rivers — may have limited or no
  modelled coverage.

  NODATA SEMANTICS (verified from depth_category band, 2026-08-23):
    The depth bands use -9999.0 as a sentinel with two semantically distinct meanings
    that can only be distinguished by cross-referencing the depth_category ancillary band:

    depth_category == -9999 AND depth == -9999  →  OUTSIDE MODEL DOMAIN
      The GloFAS hydraulic model has no output for this cell.

    depth_category == -1 or 0 AND depth == -9999  →  MODELLED DRY
      The cell is within the GloFAS model domain but is not inundated at this return
      period.  Value -1 is used in the western sub-area of tile ID230_N20_E120 (Sibalom
      area); value 0 is used in the eastern and southern sub-areas (San Jose, Hamtic).

    depth_category in {2, 3, …} AND depth > 0  →  FLOODED
      Modelled inundation with depth in metres.  Category encodes a depth class.

    The depth_category band is the authoritative domain indicator.  Presence of a
    non-sentinel depth value alone is insufficient to identify modelled-dry cells.

  PERMANENT WATER:
    The permanent_water_class band (1 = permanent water, -1 = unknown) identifies river
    channel pixels that are perennially wet.  Depths over permanent-water pixels reflect
    channel depth at the given return period, NOT over-bank inundation.  These pixels
    must be excluded from road hazard exposure analysis because roads crossing them are
    bridges rather than at-grade corridors at risk of inundation.

  1.0 M DEPTH FLOOR (Sibalom-specific artifact):
    In the Sibalom sub-area, 280 of 286 permanent-water pixels carry exactly 1.0 m depth.
    This is a river-channel minimum-depth artifact in permanent-water pixels, NOT a
    general floor across the dataset.  It is absent from non-permanent pixels in Sibalom
    and not observed in San Jose or Hamtic.  Depth distributions for non-permanent pixels
    in San Jose span 0.103–3.540 m without clamping.

  ANALYTICAL CLASSES (FloodRoute project thresholds — NOT native JRC classes):
    Adapted from Philippine flood hazard metadata for comparative analysis.
    Below 0.10 m  : below analysis threshold (not classified)
    0.10–0.50 m   : Low
    0.50–1.50 m   : Medium
    Above 1.50 m  : High

  BANDS acquired for this project (5-band depth GeoTIFF):
    Band 1  RP10_depth             — 10-year return period flood depth (m)
    Band 2  RP20_depth             — 20-year return period flood depth (m)
    Band 3  RP100_depth            — 100-year return period flood depth (m)
    Band 4  permanent_water_class  — 1 = permanent water, -1 = unknown
    Band 5  spurious_depth_category — -1 = not flagged; positive = flagged category

  BANDS acquired separately (4-band category GeoTIFF):
    Band 1  RP10_depth_category    — depth class category at RP10
    Band 2  RP100_depth_category   — depth class category at RP100
    Band 3  permanent_water_class  — same as in depth raster
    Band 4  spurious_depth_category — same as in depth raster

  TERMS OF USE:
    "The dataset is available without restriction on use or distribution."
    — JRC EE dataset documentation (accessed 2026-08-23).
    No licence key or EULA acceptance required.
    Attribution recommended: cite Baugh et al. 2024 (see citation field).

  ACCESS:
    Google Earth Engine ImageCollection: JRC/CEMS_GLOFAS/FloodHazard/v2_1
    Collection size: 264 tiles (10°×10° tiled global coverage)
    Tile intersecting all three study municipalities: ID230_N20_E120

  ACQUISITION:
    Acquired via ee.Image.getDownloadURL() using project 'geo-analyzer-web' (Community Tier).
    Separate subsets acquired per municipality + 0.05° buffer.
    Acquisition timestamp: 2026-08-23

