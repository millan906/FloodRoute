  nodata_sentinel: -9999.0    # stored in pixel values; see NODATA SEMANTICS above
  pixel_size_deg: 0.000808484
  pixel_size_m_approx: 90

# ── LiPAD suitability note ──────────────────────────────────────────────────
lipad_assessment: >
  Phil-LiDAR 1 (LiPAD) flood hazard layers for Sibalom River (ISO record: Flood
  Hazard Map — Sibalom River) were assessed as a potential higher-resolution substitute.
  Programmatic geographic intersection (verified 2026-08-23) confirms that the LiPAD
  ISO record extent [122.322°E, 10.667°N, 122.430°E, 10.808°N] does NOT intersect any
  of the three study municipalities:
    Sibalom (PH0600616):  gap ≈ 13.9 km
    San Jose (PH0600613): gap ≈ 35.8 km
    Hamtic (PH0600608):   gap ≈ 27.1 km
  LiPAD cannot substitute for JRC data for any of the three study municipalities.
  The LiPAD manifest (data/manifests/noah_flood_hazard_antique.yaml) is retained for
  documentation only; acquisition_status remains not_requested.

# ── Phase A decisions (per municipality) ───────────────────────────────────
phase_a_decisions:
  PH0600616_Sibalom:
    decision: BLOCKED
    reason: >
      Zero non-permanent flooded pixels at RP10 within municipality boundary.
      All 291 flooded pixels are permanent-water channel pixels.  The Sibalom basin
      (~443 km²) falls below the GloFAS reliable modelling threshold (~500 km²),
      producing no over-bank inundation signal for at-grade road segments.
    phase_b_permitted: false
    readiness_report: "processed/hazard/PH0600616_jrc_phase_a_readiness.yaml"

  PH0600613_SanJose:
    decision: READY
    reason: >
      265 non-permanent flooded pixels at RP10; gain of 181 additional pixels RP10→RP100;
      39 normal road segments with interior overlap ≥ 5 m (3.932 km); depth range
      0.103–3.540 m without depth-floor clamping.  All three suitability gates met.
      San Jose de Buenavista replaces Sibalom as the primary Stage 5 testbed.
    phase_b_permitted: true
    readiness_report: "processed/hazard/PH0600613_jrc_phase_a_readiness.yaml"

  PH0600608_Hamtic:
    decision: PARTIAL
    reason: >
      12 non-permanent pixels at RP10 (≥ minimum threshold of 10) and gain of 87
      RP10→RP100 (≥ 5), but only 2 normal road segments with interior overlap
      (0.066 km) — below the 3-segment minimum for comparative routing observations.
    phase_b_permitted: false
    readiness_report: "processed/hazard/PH0600608_jrc_phase_a_readiness.yaml"

