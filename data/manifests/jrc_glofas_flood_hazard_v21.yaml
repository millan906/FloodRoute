  driver: GTiff
  crs: EPSG:4326
  band_count_depth: 5
  band_count_category: 4
  band_order_depth:
    1: RP10_depth
    2: RP20_depth
    3: RP100_depth
    4: permanent_water_class
    5: spurious_depth_category
  band_order_category:
