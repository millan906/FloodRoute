title: "Digital Elevation Model — San Jose de Buenavista Study Area"
category: terrain_dem

description: >
  Digital Elevation Model (DEM) covering the San Jose de Buenavista study area,
  used for terrain characterisation and slope-based road traversability modelling.
  Candidate sources are the USGS/NASA Shuttle Radar Topography Mission (SRTM, 30 m)
  and the JAXA ALOS World 3D-30m (AW3D30, 30 m). SRTM is public domain;
  AW3D30 requires free registration. The PHIL-LiDAR 5-metre DEM (if accessible
  through DOST-ASTI for the study area) is preferred for higher resolution.
  Source to be selected and recorded after comparing availability.

