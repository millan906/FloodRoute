validation_notes: >
  Validation completed 2026-08-22:
  1. ZIP integrity: PASSED — archive opens without error, no path-traversal entries.
  2. Member count: 35 files confirmed (admin0–admin4 + adminlines + adminpoints).
     phl_admin0.shp/dbf/prj/shx/cpg  — country
     phl_admin1.shp/dbf/prj/shx/cpg  — region (17 regions)
     phl_admin2.shp/dbf/prj/shx/cpg  — province (88 provinces)
     phl_admin3.shp/dbf/prj/shx/cpg  — municipality/city (1,642 records)
     phl_admin4.shp/dbf/prj/shx/cpg  — barangay (42,048 records in DBF)
     phl_adminlines.shp/...           — admin boundary lines
     phl_adminpoints.shp/...          — admin label points
  3. Barangay-level shapefile: CONFIRMED — phl_admin4.shp present.
  4. Field names verified from DBF header (2026-08-22, pure Python struct reader):
     admin3 fields: adm3_name, adm3_pcode, adm2_name, adm2_pcode, adm1_name, ...
     admin4 fields: adm4_name, adm4_pcode, adm3_name, adm3_pcode, adm2_name, ...
     Note: field names are lowercase (adm3_pcode), not ADM3_PCODE as documented earlier.
  5. Study municipality presence confirmed in phl_admin3.dbf (2026-08-22):
     Sibalom            adm3_pcode=PH0600616  76 barangays confirmed in phl_admin4.dbf
     San Jose (Capital) adm3_pcode=PH0600613  28 barangays confirmed in phl_admin4.dbf
     Hamtic             adm3_pcode=PH0600608  47 barangays confirmed in phl_admin4.dbf
  6. PSGC code format: 9-character with PH prefix (e.g. PH0600616), not the
     10-digit numeric PSGC (060616000) used in census tables.  Use adm3_pcode
     for all municipality-level spatial joins.
  7. CRS from .prj: PENDING — confirm EPSG:4326 with ogrinfo in Stage 3.
  Limitation: boundaries are indicative polygons, not survey-grade cadastral lines.

