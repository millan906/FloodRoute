title: "Philippines Administrative Boundaries — Barangay Level with PSGC Codes (HDX COD-AB)"
category: administrative_boundaries

description: >
  Common Operational Dataset — Administrative Boundaries (COD-AB) for the Philippines,
  produced by the United Nations Office for the Coordination of Humanitarian Affairs
  (OCHA) in partnership with NAMRIA and the Philippine Statistics Authority (PSA).
  Covers all administrative levels (admin0–admin4: country, region, province,
  municipality/city, barangay) with PSGC-derived pcodes for all barangays.

  Used to extract barangay-level polygons for all three study municipalities:
    Sibalom            (adm3_pcode=PH0600616, 76 barangays)
    San Jose (Capital) (adm3_pcode=PH0600613, 28 barangays)
    Hamtic             (adm3_pcode=PH0600608, 47 barangays)

  This is a Philippines-wide dataset — NOT specific to Antique Province.
  Spatial subsetting to study municipalities is a Stage 3 preprocessing step.

  Source note: PSA does not publish bulk GIS shapefiles from its own website.
  The HDX COD-AB is the standard authoritative GIS product for Philippines boundaries,
  maintained by OCHA with PSA/NAMRIA input and used by the Philippine government,
  UN agencies, and international NGOs.  Boundaries are indicative (administrative),
  not cadastral survey lines.

  Acquisition instructions (direct download — no registration required):
    Landing page : https://data.humdata.org/dataset/cod-ab-phl
    Shapefile ZIP: https://data.humdata.org/dataset/caf116df-f984-4deb-85ca-41b349d3f313/resource/4e4067d6-3fc8-4d2c-91ea-330c3d4f8e8e/download/phl_admin_boundaries.shp.zip
    After download, run: floodroute verify-dataset phl_admin_boundaries

