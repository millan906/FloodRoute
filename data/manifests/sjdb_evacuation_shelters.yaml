    coordinates: null
    entrance_status: missing
    snap_status: skipped     # ineligible (operational_status=project_only); pipeline skips before entrance check
    readiness_contribution:
      eligible: false   # operational_status=project_only → ineligible
      routable: false
      verified: false
      auth_capacity: false
    notes: >
      Mentioned in an informal barangay DRRR plan as a candidate evacuation venue.
