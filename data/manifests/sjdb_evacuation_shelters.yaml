validation_notes: >
  Capacity values, coordinates, and operational status must be sourced from
  official documentation — do not infer or estimate missing values.
  Use data/templates/shelter_import_template.csv for data entry; the schema
  enforces evidence tiers (A/B/C/excluded), provenance rules, Philippine
  coordinate bounds, and active-status eligibility. Facilities with
  operational_status in {project_only, decommissioned, unknown} are excluded
  from all readiness counts regardless of evidence tier. READY requires
  authoritative LGU data; PARTIAL permits documented candidates from secondary
  sources and supports reproducible algorithmic research without requiring
  finalised LGU data-sharing. Official data are required before operational
  deployment. Run 'floodroute inspect-shelters' to evaluate readiness.

