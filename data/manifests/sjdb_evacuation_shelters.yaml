category: evacuation_shelters

description: >
  Official list of designated evacuation centres for San Jose de Buenavista
  municipality, including facility name, location, capacity, operator, and
  accessibility status. Primary source is the Municipal Disaster Risk Reduction
  and Management Office (MDRRMO) of San Jose de Buenavista. Secondary sources
  may include the Provincial DRRMO (Antique) and DSWD records.
  Records must be entered into data/templates/evacuation_shelters_template.csv
  after validation with the LGU. No facility records are pre-populated in this
  manifest; all values in the template must be sourced from official documentation.

