schema_version: "1.0"

dataset_id: sjdb_evacuation_shelters
title: "Evacuation Shelter Registry — San Jose de Buenavista, Antique"
category: evacuation_shelters

description: >
  Researcher-curated public candidate registry for evacuation facilities in San Jose de
  Buenavista municipality (PSGC PH0600613).  Each candidate record carries its own source
  citation (source_title, source_url, issuing_office, source_date); the registry does not
  represent a dataset supplied or validated by the MDRRMO or any LGU office.  Sources
  range from Philippine News Agency articles and OSM building data to community reports
  and draft contingency plans — evidence tiers (A/B/C) reflect source quality at the
  individual record level.

  An authoritative MDRRMO shelter registry has not been requested.  When obtained, it
  would replace or supplement this candidate registry and enable upgrading records to
  verification_status=verified and capacity_provenance=authoritative, which are
  prerequisites for READY readiness.

  Readiness tiers:
    READY   — requires authoritative LGU-sourced records (verification_status=verified,
              capacity_provenance=authoritative).
    PARTIAL — satisfied by publicly documented candidate facilities at any evidence tier;
              permits algorithmic research without LGU sign-off.
    BLOCKED — prevents all routing and allocation.
  Official LGU data are required before results may be used in any operational evacuation plan.

  Current empirical readiness: BLOCKED.
  All four candidates are ineligible: SJDB-001 and SJDB-002 have operational_status=unknown;
  SJDB-003 and SJDB-004 have operational_status=project_only.  SJDB-001's 2019 PNA/OCD
  turnover article establishes historical formal designation only — it does not confirm
  2026 current availability.  OSM-derived entrance coordinates and a computational
  graph-proximity result (node 1345, 6.3 m) are retained as research reference but do not
  contribute to readiness.  Stage 6B software is fully implemented and tested.

source_agency: null         # No single supplying agency; see record-level source_title
                            # and issuing_office for per-candidate citations
source_url: null            # No single dataset URL; individual sources cited at record level
landing_page_url: null
license_name: null          # No single license; individual record sources have varying terms
license_url: null

access_method: researcher_assembled   # Assembled from public sources; no LGU data-sharing arrangement
acquisition_status: not_requested     # MDRRMO dataset not yet requested; current registry is
                                      # researcher-assembled and does not imply LGU supply
acquisition_date: null

temporal_coverage: null    # Varies by candidate; see record-level source_date fields
geographic_coverage: "San Jose de Buenavista, Antique, Philippines"
expected_format: csv

local_path: "raw/sjdb_evacuation_shelters.csv"   # gitignored (data/raw/** rule)
template_path: "templates/shelter_import_template.csv"
file_size_bytes: null
sha256: null
crs: "EPSG:4326"           # Coordinates in WGS-84 geographic (lat/lon)

provenance: observed
validation_status: not_validated
validation_notes: >
  Capacity values, coordinates, and operational status must be sourced from official
  documentation — do not infer or estimate missing values.
  Use data/templates/shelter_import_template.csv for data entry; the schema enforces
  evidence tiers (A/B/C/excluded), provenance rules, Philippine coordinate bounds, and
  active-status eligibility.
  Facilities with operational_status in {project_only, decommissioned, unknown} are
  excluded from all readiness counts regardless of evidence tier.
  Records with null entrance_latitude or entrance_longitude are classified "no_entrance"
  by the Stage 6B snap pipeline and never contribute to routable, verified, or
  auth_capacity counts — BLOCKED remains until entrance coordinates are populated and
  validated.
  Run 'floodroute inspect-shelters' to evaluate readiness (Stage 6A).
  Run 'floodroute snap-shelters' for boundary validation and graph snapping (Stage 6B).

required_for_stage: 6

# ---------------------------------------------------------------------------
# Acquisition scope
# ---------------------------------------------------------------------------
# Describes which facility types are in scope and the conditions for entry.

acquisition_scope:
  facility_types_in_scope: >
    Purpose-built evacuation centers, covered courts, multi-purpose halls, and
    contingency facilities explicitly designated or historically activated as
    evacuation venues by the LGU.  Schools are within scope under the conditions
    below.
  school_contingency_facilities: >
    Philippine LGUs routinely activate schools as contingency evacuation centers
    during flood events.  A school may enter this registry only when one of the
    following is documented: (a) formal LGU or DepEd designation (permanent,
    contingency-based, or event-specific), or (b) evidence of historical
    activation as an evacuation venue with an identifiable, citable source.
    Schools must not be added based on proximity, capacity assumptions, or
    undocumented informal use.
  school_designation_types:
    permanent:    "Formally designated in an official evacuation plan or LGU resolution."
    contingency:  "Designated for use when primary shelters are insufficient or unavailable."
    event_specific: "Activated for a named event; does not imply standing availability."
  school_availability_caveats: >
    School availability as an evacuation venue is conditional and must not be
    assumed to persist across events.  Availability depends on: hazard type and
    severity; event declaration status; whether the school is in session;
    and LGU/DepEd authorization at the time of the event.  Historical activation
    at one event does not imply availability for future events.  Do not infer
    current availability or capacity from historical activation alone.
  school_readiness_treatment: >
    Schools without a documented designation or verified operational status
    receive operational_status=unknown (or project_only if proposed but not yet
    activated) and are excluded from readiness counts regardless of evidence tier.
    The designation type (permanent/contingency/event-specific) must be preserved
    in the candidate record notes.  Unverified schools never contribute to
    n_eligible, n_routable, n_verified, or n_auth_capacity.

citation: null             # No single citable dataset; individual candidates carry
                           # record-level citations.  MDRRMO data-sharing not yet initiated.

# ---------------------------------------------------------------------------
# Raw CSV — reconstruction and import procedure
# ---------------------------------------------------------------------------
#
# File     : data/raw/sjdb_evacuation_shelters.csv   (gitignored)
# Schema   : data/templates/shelter_import_template.csv (24-column header, tracked)
#
# To reconstruct from template:
#   1. Copy the template:
#        cp data/templates/shelter_import_template.csv data/raw/sjdb_evacuation_shelters.csv
#   2. Add one row per candidate using the field definitions in
#      src/floodroute/shelters/schema.py (ShelterRecord).
#   3. Validate the populated CSV:
#        floodroute inspect-shelters --shelters data/raw/sjdb_evacuation_shelters.csv
#   4. When entrance coordinates are available for each candidate, populate
#      entrance_latitude and entrance_longitude, then run:
#        floodroute snap-shelters
#      to validate boundary containment and snap each entrance to the road graph.
#
# Current state of coordinates:
#   SJDB-001: facility centroid (OSM polygon centroid) and entrance proxy (building west-face
#             midpoint, OSM-derived) are populated; see candidate record for caveats.
#             Entrance is provisional — not GPS-surveyed.
#   SJDB-002, SJDB-003, SJDB-004: all coordinate fields are null.
#   No pipeline snap has been performed (all candidates ineligible).  Readiness is BLOCKED.
#
# ---------------------------------------------------------------------------
# Candidate registry (Stage 6B research candidates)
# ---------------------------------------------------------------------------
#
# Classification key
#   evidence_tier       A=authoritative primary, B=documented secondary,
#                       C=anecdotal/community-reported
#   operational_status  unknown=status unconfirmed (conservative default)
#                       project_only=proposed/not yet operational
#   verification_status unverified=not validated against authoritative source
#   snap_status         skipped = pipeline did not attempt snapping because the record
#                               is ineligible (unknown or project_only operational_status)
#                       no_entrance = eligible but entrance coordinates are absent
#                       (none of these candidates currently reach the no_entrance check)
#   entrance_status     missing = entrance_latitude / entrance_longitude are null
#   coordinates         null — no entrance validated or snapped
# ---------------------------------------------------------------------------

candidates:

  - shelter_id: SJDB-001
    name: "Antique Regional Evacuation Center"
    barangay_name: "San Pedro"
    facility_type: evacuation_center
    evidence_tier: B
    operational_status: unknown   # 2019 OCD/DPWH turnover is historical only; no post-2019
                                  # source confirms 2026 current availability. unknown is
                                  # the conservative default per schema semantics.
    verification_status: unverified
    source_title: "OCD turns over P36-M regional evacuation center to Antique"
    source_url: "https://www.pna.gov.ph/articles/1065266"
    issuing_office: "OCD-6 / DPWH Region VI"
    source_date: "2019-03-21"
    # Historical / formal-turnover evidence (not current-status confirmation):
    #   PNA article (2019-03-21) documents the official OCD/DPWH P36M turnover ceremony;
    #   the facility was transferred to the Municipality of San Jose de Buenavista.
    #   OSM way:1394870512 tags the building as social_facility:shelter,
    #   social_facility:for=displaced on Real Street, Barangay San Pedro.
    #   Neither source confirms the facility is currently operational in 2026.
    # Capacity note (historical reference — not a computational field):
    historical_reported_capacity:
      value: 130
      unit: individuals
      source_date: "2019-03-21"
      exact_quotation: "can accommodate at least 33 families or 130 individuals"
      provenance: "PNA news report describing the facility at the 2019 OCD/DPWH turnover"
      limitation: >
        Not verified as current usable capacity.  Stated in a news article at time of
        turnover; no authoritative LGU capacity document was found.  Do not populate
        official_capacity or scenario_capacity from this figure without MDRRMO/LGU
        confirmation.
    coordinates:
      latitude: 10.800394           # OSM polygon centroid (way:1394870512)
      longitude: 121.948801
      entrance_latitude: 10.800406  # provisional access proxy — midpoint of building west
      entrance_longitude: 121.948580  # face facing Real Street (OSM-derived; not surveyed)
      coordinate_source: "OpenStreetMap way:1394870512 (Real Street, San Pedro)"
      coordinate_method: "osm_polygon_centroid_facility;building_west_face_midpoint_entrance_proxy"
      coordinate_uncertainty_m: 25  # map-inspection precision; not GPS-survey accuracy
    entrance_status: present        # coordinates populated; labelled as provisional proxy
    snap_status: skipped            # ineligible (operational_status=unknown); pipeline skips
                                    # before entrance check — same rule as SJDB-002
    # Graph-proximity note (research reference, not a pipeline snap result):
    #   When treating SJDB-001 as eligible for testing purposes, the entrance proxy
    #   (10.800406, 121.948580) snaps to road-graph node 1345 at 6.3 m and lies
    #   436.4 m inside the municipal boundary.  This is a computational geometric fact
    #   independent of operational status; it does not affect BLOCKED readiness.
    readiness_contribution:
      eligible: false     # operational_status=unknown → ineligible
      routable: false     # ineligible record; entrance coords not used by pipeline
      verified: false     # verification_status=unverified
      auth_capacity: false  # official_capacity=null; scenario_capacity=null
    notes: >
      [EXISTENCE]  Purpose-built P36M regional evacuation center funded by OCD and DPWH.
      Officially turned over to the Municipality of San Jose de Buenavista on 21 March 2019
      per PNA article (pna.gov.ph/articles/1065266).  Managed by LGU; monitored by OCD per
      Memorandum of Agreement.  OSM way:1394870512 tags the building as social_facility:shelter
      on Real Street, Barangay San Pedro — consistent with a purpose-built evacuation facility.

      [CURRENT STATUS]  operational_status=unknown.  The 2019 OCD/DPWH turnover is
      historical evidence of formal designation; it does not confirm the facility is
      currently operational in 2026.  No post-2019 authoritative source was found.
      Contact MDRRMO/LGU to confirm current availability before upgrading this field.

      [ENTRANCE PROXY]  entrance_latitude/longitude are a provisional access proxy derived
      from the midpoint of the building's west face (facing Real Street) as mapped in OSM.
      This is not a GPS-surveyed entrance.  coordinate_uncertainty_m=25 reflects
      map-inspection precision only; do not treat as field-validated coordinates.

      [CAPACITY]  official_capacity=null; scenario_capacity=null.  No verified current
      usable capacity figure is available.  Historical reference: PNA 2019 article states
      the center "can accommodate at least 33 families or 130 individuals" (exact quotation;
      source date 2019-03-21; provenance: news report at time of turnover).  Recorded in
      historical_reported_capacity above; must not be used as official_capacity or
      scenario_capacity without MDRRMO/LGU confirmation.

      [GRAPH PROXIMITY]  Computationally, the entrance proxy is 6.3 m from road-graph
      node 1345 and 436.4 m inside the municipal boundary.  These are geometric facts
      for research reference only; no pipeline snap is performed while record is ineligible.

  - shelter_id: SJDB-002
    name: "Bariri Covered Court"
    barangay_name: "Bariri"
    facility_type: covered_court
    evidence_tier: C
    operational_status: unknown
