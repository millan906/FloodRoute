schema_version: "1.0"

dataset_id: sjdb_evacuation_shelters
title: "Evacuation Shelter Registry — San Jose de Buenavista, Antique"
category: evacuation_shelters

description: >
  Designated evacuation centres for San Jose de Buenavista municipality.
  Primary source: Municipal Disaster Risk Reduction and Management Office
  (MDRRMO), San Jose de Buenavista. Secondary sources may include the
  Provincial DRRMO (Antique) and DSWD records.
  Readiness tiers: READY requires authoritative LGU-sourced records
  (verification_status=verified, capacity_provenance=authoritative); PARTIAL
  is satisfied by publicly documented candidate facilities at any evidence tier
  and permits algorithmic research without LGU sign-off; BLOCKED prevents all
  routing and allocation. Official LGU data are required before results may be
  used in any operational evacuation plan.
  Records are entered into data/templates/shelter_import_template.csv after
  validation with the LGU. No facility records are pre-populated here.

