  # Produced by: floodroute snap-shelters (Stage 6B pipeline, 2026-08-28)
  # Updated by: temporal-validity audit of SJDB-001 (2026-08-28)
  decision: BLOCKED
  n_total: 4
  n_eligible: 0     # SJDB-001=unknown (ineligible), SJDB-002=unknown, SJDB-003/004=project_only
  n_routable: 0     # no eligible record reaches the entrance-coordinate check
  n_partial_candidates: 0   # eligible + routable; need ≥2 for PARTIAL
  n_ready_candidates: 0     # eligible + routable + verified + auth_cap
  n_verified: 0     # no candidate has verification_status=verified
  n_auth_capacity: 0  # no candidate has official_capacity with authoritative provenance
  reason: >
    All four candidates are ineligible: SJDB-001 and SJDB-002 have operational_status=unknown;
    SJDB-003 and SJDB-004 have operational_status=project_only.  SJDB-001 operational_status
    was corrected from 'operational' to 'unknown' during the 2026-08-28 temporal-validity
    audit — the 2019 OCD/DPWH PNA article is historical evidence only; no post-2019 source
    confirms 2026 availability.  Zero eligible candidates; PARTIAL requires ≥2 eligible+routable.
  snap_results_summary:
    SJDB-001: "skipped — ineligible (unknown operational_status), entrance proxy present but not used"
    SJDB-002: "skipped — ineligible (unknown), no coordinates"
    SJDB-003: "skipped — ineligible (project_only), no coordinates"
    SJDB-004: "skipped — ineligible (project_only), no coordinates"
  stage_6b_software_status: >
    Fully implemented and tested (snap.py, containment.py, phase_b.py, snap-shelters CLI,
    54 unit tests passing).  Pipeline ran successfully on 2026-08-28.
  path_to_partial: >
    Confirm current operational status of SJDB-001 directly with MDRRMO/LGU and update
    operational_status to 'operational' or 'standby'.  Then locate or confirm a second
    eligible facility (e.g. confirm SJDB-002 is currently operational).  Both eligible
    candidates must have entrance coordinates to reach PARTIAL.
  path_to_ready: >
    Two or more candidates must be: eligible, routable, verification_status=verified, and
    have official_capacity with capacity_provenance=authoritative.  This requires formal
    LGU data-sharing — none of the current candidates meets any of these criteria.
