schema_version: "1.0"

dataset_id: sjdb_evacuation_shelters
title: "Evacuation Shelter Registry — San Jose de Buenavista, Antique"
category: evacuation_shelters

description: >
  Designated evacuation centres for San Jose de Buenavista municipality (PSGC PH0600613).
  Primary source: Municipal Disaster Risk Reduction and Management Office (MDRRMO),
  San Jose de Buenavista.  Secondary sources may include the Provincial DRRMO (Antique)
  and DSWD records.

  Readiness tiers:
    READY   — requires authoritative LGU-sourced records (verification_status=verified,
              capacity_provenance=authoritative).
    PARTIAL — satisfied by publicly documented candidate facilities at any evidence tier;
              permits algorithmic research without LGU sign-off.
    BLOCKED — prevents all routing and allocation.
  Official LGU data are required before results may be used in any operational evacuation plan.

  Current empirical readiness: BLOCKED.
  All four candidates below have null entrance coordinates; the Stage 6B pipeline
  correctly classifies each as "no_entrance" and none contributes to any readiness count.
  Stage 6B software (boundary validation, graph snapping, CLI snap-shelters) is fully
  implemented and tested; it awaits entrance coordinates before producing snap results.

