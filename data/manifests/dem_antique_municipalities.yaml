title: "Copernicus DEM GLO-30 — Antique Study Municipality Tiles (N10_E121, N10_E122)"
category: terrain_dem

description: >
  Digital Elevation Model for the three FloodRoute study municipalities sourced from
  the Copernicus DEM GLO-30 (Global 30-metre DEM), a 1 arc-second (~30 m) resolution
  DSM derived from TanDEM-X radar interferometry (DLR / Airbus).  Distributed as
  Cloud-Optimized GeoTIFF (COG) tiles via the AWS Open Data Program
  (s3://copernicus-dem-30m) without authentication.

  Source selection rationale (Copernicus GLO-30 preferred over alternatives):
    Copernicus GLO-30:
      — 30 m resolution, adequate for road-network traversability at municipal scale
      — EGM2008 vertical datum (more accurate than SRTM EGM96 in tropical archipelago)
      — Copernicus free licence (attribution required, no registration)
      — Direct HTTPS download from AWS S3, fully reproducible without account
      — No data voids in Philippines (radar-derived, cloud-independent)
    SRTM 1 arc-sec (~30 m): public domain but requires USGS Earth Explorer account;
      EGM96 vertical datum; data voids in steep terrain; older (Feb 2000).
    AW3D30 (JAXA, 30 m): requires free registration on JAXA portal; EGM96 datum.
    PHIL-LiDAR 5 m: highest resolution but requires institutional registration and
      formal data request to DOST-ASTI; not directly reproducible.

  Tile coverage analysis (2026-08-22):
    All three study municipalities fall within the 10°N–11°N latitude band:
      Sibalom:            bbox ~10.683°N–10.845°N, 121.964°E–122.207°E (spans both tiles)
      San Jose (Capital): bbox ~10.700°N–10.810°N, 121.850°E–122.000°E (mostly N10_E121)
      Hamtic:             bbox ~10.581°N–10.754°N, 121.950°E–122.066°E (spans both tiles)

    Tiles selected (2 tiles cover all three municipalities completely):

    Tile         File                          Covers
    ----------   ----------------------------  -----------------------------------------------
    N10_E121     cop_dem30_N10_E121.tif        West parts of San Jose & Hamtic; small western
                                               edge of Sibalom (121°E–122°E, 10°N–11°N)
    N10_E122     cop_dem30_N10_E122.tif        East parts of Sibalom (primary experiment area);
                                               east parts of San Jose and Hamtic (122°E–123°E)

    Source URLs (direct HTTPS — no authentication required):
      N10_E121: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N10_00_E121_00_DEM/Copernicus_DSM_COG_10_N10_00_E121_00_DEM.tif
      N10_E122: https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N10_00_E122_00_DEM/Copernicus_DSM_COG_10_N10_00_E122_00_DEM.tif

    Tiles NOT required for the three-municipality study scope:
      N09_E121/N09_E122 — all municipalities are north of 10°N; N09 covers 9°N–10°N only
      N11_E121/N11_E122 — all municipalities are south of 11°N; N11 covers 11°N–12°N only

