title: "OpenStreetMap Road Network Extract — San Jose de Buenavista Area"
category: road_network

description: >
  OpenStreetMap (OSM) planet extract for the Philippines, to be clipped to
  the San Jose de Buenavista study area. Provides the base road network
  for evacuation-route modelling. Will require tag filtering to retain
  highway features only. The Geofabrik Philippines extract is a regularly
  updated, stable snapshot.

